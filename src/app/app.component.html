<div class="platforms-container">
  <div
    *ngFor="let platform of socialNetworks"
    class="platform-card"
    [ngStyle]="{ 'background-color': getPlatformColor(platform.platform) }"
  >
    <button>{{ "add new " + platform.type }}</button>
    <div class="platform-details">
      <span>{{ platform.platform }}</span>
      <span *ngIf="platform.platformType === 'premium'" class="premium-star"
        >⭐</span
      >
    </div>
  </div>
</div>

<div class="tabs">
  <button (click)="activeTab = 'user'">Users</button>
  <button (click)="activeTab = 'notifications'">
    Notifications
  </button>
</div>

<div *ngIf="activeTab === 'user'">
  <app-user *ngFor="let user of users" [user]="user"></app-user>
</div>

<div *ngIf="activeTab === 'notifications'">
  <app-notification *ngFor="let user of users" [user]="user"></app-notification>
</div>
